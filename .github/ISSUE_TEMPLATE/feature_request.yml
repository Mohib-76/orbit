name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do that Orbit doesn't let you do today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How do you imagine it working?
  - type: textarea
    id: devices
    attributes:
      label: Devices (if relevant)
      placeholder: Phone model, Android version, Windows version, earbuds model…
