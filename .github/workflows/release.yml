name: Release

# Push a tag like v1.0.0 to build both apps and draft a GitHub release.
# Android signing needs these repository secrets (see docs/RELEASING.md):
#   ORBIT_KEYSTORE_BASE64, ORBIT_KEYSTORE_PASSWORD, ORBIT_KEY_ALIAS, ORBIT_KEY_PASSWORD

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    # The Windows app ships the signed APK so it can install Orbit on the phone over USB.
    needs: android
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Fetch third-party binaries
        shell: pwsh
        run: ./tools/fetch-thirdparty.ps1
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: apk
      - name: Test
        run: dotnet test windows/Orbit.Tests -c Release
      - name: Publish (self-contained)
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          $apk = (Resolve-Path "apk/Orbit-$v-android.apk").Path
          dotnet publish windows/Orbit.Windows -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=true -p:Version=$v "-p:OrbitPhoneApk=$apk" -o dist/windows
          if (-not (Test-Path dist/windows/phone/Orbit.apk)) { throw "The phone app wasn't bundled" }
          Compress-Archive dist/windows/* "dist/Orbit-$v-windows-x64.zip"
      - name: Installer
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" "/DSourceDir=$PWD\dist\windows" "/O$PWD\dist" windows/installer/Orbit.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/OrbitSetup-*.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ORBIT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::ORBIT_KEYSTORE_BASE64 secret is not set"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ORBIT_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build release APK
        working-directory: android
        env:
          ORBIT_KEYSTORE_PASSWORD: ${{ secrets.ORBIT_KEYSTORE_PASSWORD }}
          ORBIT_KEY_ALIAS: ${{ secrets.ORBIT_KEY_ALIAS }}
          ORBIT_KEY_PASSWORD: ${{ secrets.ORBIT_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --console=plain
          v="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "../Orbit-$v-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Orbit-*-android.apk

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* --draft --title "Orbit $GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md for what's new. Install: run OrbitSetup on Windows and install the APK on Android."
